# Entitlement probe for Apple's Accessory Notifications route (task A5, checkpoint H2).
# It answers one question: can this Apple developer team sign and install an app whose
# extensions carry the three accessory entitlements? It forwards nothing.
name: RanneProbe
options:
  bundleIdPrefix: dev.koit.ranne
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your own team here or pass DEVELOPMENT_TEAM to xcodebuild. Never commit it.
    DEVELOPMENT_TEAM: ""

targets:
  RanneProbe:
    type: application
    platform: iOS
    sources:
      - Probe
    info:
      path: Probe/Info-Generated.plist
      properties:
        CFBundleDisplayName: "Ranne Probe"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koit.ranne.probe
    dependencies:
      - target: ProbeDataProvider
        embed: true
      - target: ProbeTransportSecurity
        embed: true
      - target: ProbeTransport
        embed: true

  ProbeDataProvider:
    type: extensionkit-extension
    platform: iOS
    sources:
      - DataProvider
    info:
      path: DataProvider/Info-Generated.plist
      properties:
        CFBundleDisplayName: "Ranne Probe Data Provider"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-data-provider
          EXCapabilities:
            - AccessoryNotifications.NotificationsForwarding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koit.ranne.probe.dataprovider
        CODE_SIGN_ENTITLEMENTS: DataProvider/DataProvider.entitlements

  ProbeTransportSecurity:
    type: extensionkit-extension
    platform: iOS
    sources:
      - TransportSecurity
    info:
      path: TransportSecurity/Info-Generated.plist
      properties:
        CFBundleDisplayName: "Ranne Probe Transport Security"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-security
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koit.ranne.probe.transportsecurity
        CODE_SIGN_ENTITLEMENTS: TransportSecurity/TransportSecurity.entitlements

  ProbeTransport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Transport
    info:
      path: Transport/Info-Generated.plist
      properties:
        CFBundleDisplayName: "Ranne Probe Transport"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.accessory-transport-extension
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koit.ranne.probe.transport
        CODE_SIGN_ENTITLEMENTS: Transport/Transport.entitlements
